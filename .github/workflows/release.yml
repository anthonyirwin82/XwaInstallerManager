name: Release

# Manual only: run from the Actions tab (or `gh workflow run release.yml`).
# Nothing is built or published on a normal push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0). Leave empty to use the version from Directory.Build.props."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/XwaInstallerManager/XwaInstallerManager.csproj

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: XwaInstallerManager-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: XwaInstallerManager-linux-x64.zip
          - os: macos-latest
            rid: osx-arm64
            archive: XwaInstallerManager-macos-arm64.zip
            app_bundle: true
          - os: macos-latest
            rid: osx-x64
            archive: XwaInstallerManager-macos-x64.zip
            app_bundle: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore XwaInstallerManager.slnx

      - name: Test
        run: dotnet test XwaInstallerManager.slnx --no-restore --verbosity normal

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "publish/${{ matrix.rid }}"

      - name: Build macOS .app bundle
        if: matrix.app_bundle
        shell: bash
        run: |
          PUBLISH="publish/${{ matrix.rid }}"
          APP="$PUBLISH/XwaInstallerManager.app"

          # Start clean so a re-run cannot copy the bundle into itself.
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Everything the app needs lives in Contents/MacOS so the native
          # dylibs are found next to the executable.
          find "$PUBLISH" -maxdepth 1 -type f -exec cp {} "$APP/Contents/MacOS/" \;

          # BSD grep (macOS) has no lookbehind, so use sed instead.
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          VERSION=${VERSION:-1.0.0}

          # Written with printf so the YAML block scalar stays valid (a heredoc
          # body at column 0 would terminate the block).
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">'
            printf '%s\n' '<dict>'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleName' 'XwaInstallerManager'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleDisplayName' 'Xwa Installer Manager'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleIdentifier' 'com.xwainstallermanager.app'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleVersion' "$VERSION"
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleShortVersionString' "$VERSION"
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundlePackageType' 'APPL'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleExecutable' 'XwaInstallerManager'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'CFBundleInfoDictionaryVersion' '6.0'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'LSMinimumSystemVersion' '11.0'
            printf '    <key>%s</key>\n    <true/>\n' 'NSHighResolutionCapable'
            printf '    <key>%s</key>\n    <string>%s</string>\n' 'LSApplicationCategoryType' 'public.app-category.utilities'
            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > "$APP/Contents/Info.plist"

          chmod +x "$APP/Contents/MacOS/XwaInstallerManager"

          # Ad-hoc sign so Gatekeeper does not reject the bundle outright.
          # (Users still need to allow it on first launch; see the release notes.)
          codesign --force --deep --sign - "$APP" || echo "codesign failed; continuing unsigned"

      - name: Package (zip)
        shell: bash
        run: |
          if [ "${{ matrix.app_bundle }}" = "true" ]; then
            # Zip the .app bundle itself so it extracts as a single app.
            cd "publish/${{ matrix.rid }}"
            zip -qry "../../${{ matrix.archive }}" "XwaInstallerManager.app"
          else
            # Zip the contents of the publish folder, not the folder itself, so
            # the archive extracts straight into the user's chosen directory.
            cd "publish/${{ matrix.rid }}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              # -x! excludes the native .pdb files (SkiaSharp's alone is ~84 MB).
              7z a -tzip "../../${{ matrix.archive }}" ./* -xr'!*.pdb'
            else
              zip -r "../../${{ matrix.archive }}" . -x '*.pdb'
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          if [ -z "$VERSION" ]; then
            # Fall back to <Version> in Directory.Build.props.
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine a version." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Update version.txt
        shell: bash
        run: |
          # The app's update check reads this file from the default branch, so it
          # must match the version being released.
          printf '%s\n' "${{ steps.version.outputs.version }}" > version.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt

          if git diff --cached --quiet; then
            echo "version.txt already up to date."
          else
            git commit -m "Update version.txt to ${{ steps.version.outputs.version }}"
            git push
          fi

      - name: List artifacts
        run: ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: XwaInstallerManager ${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*.zip
          body: |
            Cross-platform build of XwaInstallerManager ${{ steps.version.outputs.version }}.

            | Platform | Download |
            |---|---|
            | Windows (x64) | `XwaInstallerManager-win-x64.zip` |
            | Linux (x64) | `XwaInstallerManager-linux-x64.zip` |
            | macOS (Apple Silicon) | `XwaInstallerManager-macos-arm64.zip` |
            | macOS (Intel) | `XwaInstallerManager-macos-x64.zip` |

            Each archive is self-contained — no .NET runtime required.

            **Windows / Linux** — unzip anywhere and run `XwaInstallerManager`. On Linux the executable may need its permission set:

            ```bash
            chmod +x XwaInstallerManager
            ```

            **macOS** — the zip contains `XwaInstallerManager.app`. Drag it to Applications and open it. The bundle is ad-hoc signed, so on first launch macOS may block it: right-click the app and choose **Open**, or allow it under **System Settings → Privacy & Security**.

            **Extracting GOG game files** requires [innoextract](https://constexpr.org/innoextract/) on your `PATH`.
